name: Playwright Grind

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run grinder
        run: node runner.js
        env:
          LOCAL_STORAGE_JSON: ${{ secrets.LOCAL_STORAGE_JSON_1 }}
          COLLAB_CHANNEL_ID: UCg0qWTbn3R6j5K7YWbrMLNw
          TARGET_URL: https://tnstats.dev/web-grind
        
      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug.png
          retention-days: 1
          if-no-files-found: ignore
