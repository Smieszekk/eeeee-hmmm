name: Playwright Grind

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run grinder
        run: node runner.js
        env:
          LOCAL_STORAGE_JSON: ${{ secrets.LOCAL_STORAGE_JSON_1 }}
          COLLAB_CHANNEL_ID: UCg0qWTbn3R6j5K7YWbrMLNw
          TARGET_URL: https://tnstats.dev/web-grind
          # DISSTRACK_CHANNEL_ID: ID_LUB_NAZWA_KANALU   # odkomentuj, zeby wlaczyc Disstrack

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug-start.png
            debug-end.png
          retention-days: 1
          if-no-files-found: ignore

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run playwright.yml --ref ${{ github.ref_name }}
